#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "arcenalportail"
name = "ARCenal Portail"
description.fr = "Portail QSSE mobile des équipiers, appairé par ARCenal Bridge"
description.en = "Mobile employee QSSE portal, paired by ARCenal Bridge"
version = "1.0.2~ynh1"
maintainers = ["ARCenal"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/arcenal-coder/arcenalportail_ynh"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = true
sso = true
disk = "20M"
ram.build = "20M"
ram.runtime = "32M"

[install]
    [install.domain]
    type = "domain"
    [install.path]
    type = "path"
    default = "/mon-espace"
    [install.init_main_permission]
    type = "group"
    default = "all_users"


[resources]
    [resources.system_user]
    [resources.install_dir]
    [resources.permissions]
    main.url = "/"
    [resources.apt]
packages = "php8.2-fpm, php8.2-curl, php8.2-mbstring"
