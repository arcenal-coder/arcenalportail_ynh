#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "arcenalportail"
name = "VIGIlance"
description.fr = "Gestion des collaborateurs et espace personnel, propulsés par ARCenal OS"
description.en = "Employee management and personal workspace, powered by ARCenal OS"
version = "1.1.0~beta2+ynh1"
maintainers = ["ARCenal"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/arcenal-coder/arcenal-qsse"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = true
sso = true
disk = "20M"
ram.build = "20M"
ram.runtime = "32M"

[install]
    [install.domain]
    type = "domain"
    [install.path]
    type = "path"
    default = "/mon-espace"
    [install.init_main_permission]
    type = "group"
    default = "all_users"
    [install.initial_admin]
    ask.fr = "Administrateur initial de VIGIlance"
    ask.en = "Initial VIGIlance administrator"
    type = "user"
    [install.company_name]
    ask.fr = "Nom de l'entreprise"
    ask.en = "Company name"
    type = "string"
    default = "Entreprise"

[resources]
    [resources.system_user]
    [resources.install_dir]
    [resources.data_dir]
    subdirs = ["logos"]
    group = "__APP__:"
    [resources.permissions]
    main.url = "/"
    [resources.apt]
packages = "php8.2-fpm, php8.2-cli, php8.2-curl, php8.2-mbstring, php8.2-sqlite3"
