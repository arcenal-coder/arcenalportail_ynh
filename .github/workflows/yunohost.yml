# LOCAL COPY ONLY. Not registered under .github/workflows/ and never dispatched.
# After explicit authorization, replace the existing workflow only on the
# qualification branch, retaining its ID. No push trigger, Preview or promotion.
name: Qualify YunoHost package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s105-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check prepared controls, without any native action
        run: |
          bash -n qualification/sirh1-native/execution/run.sh
          bash -n qualification/sirh1-native/execution/bridge.sh
          php -l qualification/sirh1-native/execution/probe.php
          python3 -c 'import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path("qualification/sirh1-native/execution").glob("*.py")]'
          python3 qualification/sirh1-native/execution/prepare.py verify-inputs --inputs qualification/sirh1-native/prepared
  package:
    needs: qualification-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the authorized qualification branch
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = arcenal-coder/arcenalportail_ynh
          test "$GITHUB_REF" = refs/heads/qualification/sirh1-native-ynh3
      - name: Prepare isolated Incus runner (existing recipe)
        run: |
          sudo systemctl stop docker.service docker.socket || true
          sudo apt-get update
          sudo apt-get install -y incus jq lynx btrfs-progs python3-toml python3-pycurl python3-bs4 python3-lxml python3-venv
          sudo incus admin init --minimal
          sudo incus remote add yunohost https://repo.yunohost.org/incus --protocol simplestreams --public
          sudo usermod -a -G incus-admin root
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -I FORWARD -i incusbr0 -j ACCEPT
          sudo iptables -I FORWARD -o incusbr0 -j ACCEPT
          sudo incus image copy yunohost:yunohost/bookworm-stable/appci local: --alias yunohost-bookworm-stable-appci
          mkdir -p "$RUNNER_TEMP/s105-platform"
          sudo incus query /1.0/images/aliases/yunohost-bookworm-stable-appci > "$RUNNER_TEMP/s105-platform/alias.json"
          fingerprint=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1]));print(d.get("metadata",d)["target"])' "$RUNNER_TEMP/s105-platform/alias.json")
          sudo incus query "/1.0/images/$fingerprint" > "$RUNNER_TEMP/s105-platform/image.json"
      - name: Run existing checker with the additional S1-05 hooks
        run: bash qualification/sirh1-native/execution/run.sh
      - name: Make raw evidence readable even after failure
        if: always()
        run: |
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/s105" "$RUNNER_TEMP/package_check" "$RUNNER_TEMP/s105-platform" || true
      - name: Prepare and verify sanitized upload only
        id: safe_evidence
        if: always()
        run: |
          python3 qualification/sirh1-native/execution/sanitize.py upload --raw "$RUNNER_TEMP" --output "$RUNNER_TEMP/s105-upload"
          test -f "$RUNNER_TEMP/s105-upload/upload-verified.json"
      - name: Keep verified sanitized evidence, no raw fallback or promotion
        if: ${{ always() && steps.safe_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sirh1-native-ynh3
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/s105-upload/
